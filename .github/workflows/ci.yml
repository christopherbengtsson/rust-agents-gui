name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Corepack
        run: npm install --global corepack@0.36.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Select repository Rust toolchain
        run: rustup show active-toolchain

      - name: Report environment
        run: |
          node --version
          corepack --version
          corepack pnpm --version
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          sw_vers
          uname -m

      # Static Tauri checks require the resource; this builds but never runs it.
      - name: Prepare supervisor resource
        run: node scripts/prepare-supervisor.mjs debug

      - name: Verify
        run: corepack pnpm verify

      # verify already typechecks; do not repeat frontend:build's tsc invocation.
      - name: Build frontend assets
        run: corepack pnpm exec vite build
