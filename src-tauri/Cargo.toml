[package]
name = "workspace-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
qualification = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
workspace-core.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["signal", "macros"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
