[workspace]
members = ["crates/core", "crates/supervisor", "src-tauri", "crates/storage-checkpoint", "crates/workspace-checkpoint"]
default-members = ["crates/core", "crates/supervisor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
workspace-core = { path = "crates/core" }

sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
