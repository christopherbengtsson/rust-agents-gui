[workspace]
members = ["crates/core", "crates/supervisor", "src-tauri"]
default-members = ["crates/core", "crates/supervisor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
workspace-core = { path = "crates/core" }
