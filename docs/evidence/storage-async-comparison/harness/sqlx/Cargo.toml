[package]
name = "storage-async-sqlx"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
[workspace]
[features]
default = ["sqlx-driver"]
sqlx-driver = []
[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
libsqlite3-sys = "=0.37.0"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "net", "sync", "macros"] }
serde_json = "=1.0.154"
[profile.release]
strip = true
