[package]
name = "workspace-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
qualification = []
codegen = ["dep:ts-rs", "dep:schemars"]

[[bin]]
name = "export-contracts"
path = "src/bin/export-contracts.rs"
required-features = ["codegen"]
test = false

[dependencies]
semver = "=1.0.28"
libc = "0.2.191"
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.29.2", features = ["v4", "serde"] }
ts-rs = { version = "=12.0.1", features = ["uuid-impl"], optional = true }
schemars = { version = "=1.2.3", features = ["uuid1"], optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "sync", "time", "rt", "process", "macros"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
url = "=2.5.8"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "test-util"] }

[[bin]]
name = "qualify-process-effects"
path = "src/bin/qualify-process-effects.rs"
required-features = ["qualification"]
test = false
