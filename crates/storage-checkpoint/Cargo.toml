[package]
name = "storage-checkpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
codegen = ["dep:ts-rs", "dep:schemars"]
qualification = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid = { version = "1.29.2", features = ["v4", "serde"] }
libc = "0.2.191"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ts-rs = { version = "=12.0.1", features = ["uuid-impl"], optional = true }
schemars = { version = "=1.2.3", features = ["uuid1"], optional = true }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }

[[bin]]
name = "qualify-storage"
path = "src/main.rs"
required-features = ["qualification"]
test = false
