[package]
name = "workspace-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
workspace-core.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
process-qualification = []

# Inherited actual-process qualification stays explicit and outside unit gates.
[[test]]
name = "startup"
required-features = ["process-qualification"]

[[test]]
name = "discovery"
required-features = ["process-qualification"]
