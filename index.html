<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Workspace</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">AGENT WORKSPACE · DEVELOPMENT BASELINE</p>
      <h1>Your local workspace</h1>
      <p>The desktop connects to a separate local supervisor.</p>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Supervisor connection</h2>
        <p id="status" role="status" aria-live="polite">Connecting…</p>
        <dl id="details"></dl>
        <button id="refresh" type="button">Refresh status</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
